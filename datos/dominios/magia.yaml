# Dominio Magia: lo común a cartomagia, monedas, mentalismo o escena.

dominio:
  id: magia
  nombre: Magia
  descripcion: Producir en el público la experiencia de lo imposible, con cualquier material.

conceptos:
  - id: magia.efecto
    nombre: Efecto
    descripcion: Lo que el público percibe que ha pasado.

  - id: magia.metodo
    nombre: Método
    descripcion: Cómo se hace en realidad; el público nunca debe verlo.

  - id: magia.efecto.localizacion
    nombre: Localización
    descripcion: Encontrar algo elegido entre muchos.
    requiere: [magia.efecto]
    revisar: true   # ¿categoría propia o variante de predicción?

  - id: magia.efecto.transposicion
    nombre: Transposición
    descripcion: Algo pasa de un lugar a otro sin camino visible.
    requiere: [magia.efecto]

  - id: magia.efecto.prediccion
    nombre: Predicción
    descripcion: Lo que va a pasar estaba anunciado antes de que pasara.
    requiere: [magia.efecto]

  - id: magia.naturalidad
    nombre: Naturalidad
    descripcion: Que el gesto secreto parezca exactamente el gesto normal.
    requiere: [magia.metodo]

  - id: magia.angulos
    nombre: Ángulos
    descripcion: Desde dónde puede ver el público sin descubrir el método.
    requiere: [magia.metodo]

  - id: magia.desvio-atencion
    nombre: Desvío de atención
    descripcion: Llevar la atención lejos del método justo cuando ocurre.
    requiere: [actuacion.gestion-atencion, magia.metodo]

  - id: magia.timing
    nombre: Timing
    descripcion: Separar el momento del método del momento del efecto.
    requiere: [magia.metodo, magia.efecto]

  - id: magia.guion
    nombre: Guion y presentación
    descripcion: La historia o el motivo que da sentido al efecto.
    requiere: [actuacion.presencia, magia.efecto]
