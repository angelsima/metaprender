# Estilo Magia de cerca: prueba de que «estilo» funciona fuera de la música.
# Sus dimensiones vienen de dos dominios (Magia y Actuación).

estilo:
  id: magia.estilo.cerca
  nombre: Magia de cerca
  dominio: magia
  descripcion: Magia a uno o dos metros del público, a menudo con objetos cotidianos y cartas.
  configuracion:
    - dimension: magia.angulos
      valor: público muy cerca y a veces alrededor; los ángulos son exigentes
    - dimension: actuacion.leer-publico
      valor: interacción directa con cada espectador
    - dimension: magia.guion
      valor: registro conversacional, más charla que discurso
