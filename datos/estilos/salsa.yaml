# Estilo Salsa: una configuración fijada del dominio Música.
# Los conceptos propios del estilo viven aquí, pero pertenecen al dominio:
# cada disciplina los realiza a su manera.

estilo:
  id: musica.estilo.salsa
  nombre: Salsa
  dominio: musica
  descripcion: Música bailable de raíz cubana, con todos los patrones encajados sobre la clave.
  configuracion:
    - dimension: musica.compas
      valor: 4/4, a menudo sentido a la breve (dos grandes pulsos por compás)
    - dimension: musica.patron-ritmico
      valor: todo se ordena sobre la clave de son, en sentido 3-2 o 2-3
    - dimension: musica.tempo
      valor: de medio a muy rápido
    - dimension: musica.progresion
      valor: ciclos cortos repetidos; en el montuno, típicamente I-IV-V-IV
    - dimension: musica.textura
      valor: patrones entrelazados (clave, campana, conga, bajo anticipado, montuno de piano o tres)
    - dimension: musica.forma
      valor: tema, montuno con coro y pregón, mambo y vuelta
  revisar: true

conceptos:
  - id: musica.salsa.clave-son
    nombre: Clave de son
    descripcion: Patrón de cinco golpes en dos compases, un lado con tres y otro con dos; se toca 3-2 o 2-3 según la canción.
    requiere: [musica.contratiempo, musica.compas]
    caracteriza: [musica.estilo.salsa]

  - id: musica.salsa.bajo-anticipado
    nombre: Tumbao de bajo
    descripcion: El bajo suena en el «y» del 2 y en el 4, anticipando el acorde del compás siguiente; el 1 queda vacío.
    requiere: [musica.contratiempo, musica.progresion]
    caracteriza: [musica.estilo.salsa]

  - id: musica.salsa.tumbao-conga
    nombre: Tumbao de conga
    descripcion: Patrón base de la conga, con los tonos abiertos en el 4 y el «y» del 4.
    requiere: [musica.patron-ritmico]
    caracteriza: [musica.estilo.salsa]
    revisar: true

  - id: musica.salsa.montuno
    nombre: Montuno (guajeo)
    descripcion: Figura sincopada que recorre la progresión con notas del acorde, como la tocan el piano o el tres.
    requiere:
      - musica.progresion
      - { id: musica.salsa.clave-son, modo: intuitivo }
    caracteriza: [musica.estilo.salsa]
