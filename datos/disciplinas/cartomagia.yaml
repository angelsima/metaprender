# Disciplina Cartomagia (dominio Magia).
# Prueba de contraste: otro dominio, otras capas, mismo metamodelo.
# Depende también del dominio Actuación.

disciplina:
  id: cartomagia
  nombre: Cartomagia
  dominio: magia
  capas:
    baraja: [agarre, movimiento, tecnica, efecto, rutina, espectaculo]
  etiquetas_capas: { tecnica: técnica, espectaculo: espectáculo }
  familias:
    - { id: manejo, nombre: "Agarres, cortes y mezclas reales" }
    - { id: control, nombre: Controles }
    - { id: levantada, nombre: Levantadas }
    - { id: mezcla-falsa, nombre: Mezclas y cortes falsos }
    - { id: forzaje, nombre: Forzajes }
    - { id: presentacion, nombre: Presentación }
  indicadores:
    - { id: limpieza, nombre: Limpieza }
    - { id: naturalidad, nombre: Naturalidad, descripcion: "El gesto secreto es igual que el gesto normal." }
    - { id: angulos, nombre: Ángulos, descripcion: "Resiste desde dónde mira el público." }
    - { id: timing, nombre: Timing }
    - { id: presentacion, nombre: Presentación }

piezas:
  # --- Agarres ---
  - id: carto.agarre.mecanico
    nombre: Agarre de mecánico
    descripcion: La baraja en la mano izquierda, con el índice en el borde delantero.
    capa: agarre
    familia: manejo

  - id: carto.agarre.biddle
    nombre: Agarre de Biddle
    descripcion: La baraja sujeta desde arriba por la mano derecha, por los extremos.
    capa: agarre
    familia: manejo

  # --- Movimientos ---
  - id: carto.mov.corte
    nombre: Corte simple
    capa: movimiento
    familia: manejo
    requiere: [carto.agarre.mecanico]

  - id: carto.mov.mezcla-por-arriba
    nombre: Mezcla por arriba
    descripcion: La mezcla de toda la vida, de mano a mano.
    capa: movimiento
    familia: manejo
    requiere: [carto.agarre.mecanico]

  - id: carto.mov.break-menique
    nombre: Separación con el meñique
    descripcion: Mantener una pequeña separación en la baraja con la yema del meñique.
    capa: movimiento
    familia: control
    requiere: [carto.agarre.mecanico]
    indicadores: [angulos]

  - id: carto.mov.doble-levantada
    nombre: Doble levantada
    descripcion: Levantar dos cartas como si fueran una.
    capa: movimiento
    familia: levantada
    requiere:
      - { id: carto.mov.break-menique, etapa: a-tempo }
      - carto.agarre.biddle
      - { id: magia.naturalidad, modo: intuitivo }
    indicadores: [naturalidad, limpieza]

  # --- Técnicas ---
  - id: carto.tec.doble-corte
    nombre: Control por doble corte
    descripcion: Llevar la carta elegida arriba con dos cortes que parecen uno normal.
    capa: tecnica
    familia: control
    compuesto_de: [carto.mov.break-menique, carto.mov.corte]
    requiere:
      - { id: magia.naturalidad, modo: intuitivo }
    indicadores: [naturalidad]

  - id: carto.tec.mezcla-falsa
    nombre: Mezcla falsa por arriba
    descripcion: Parece una mezcla, pero la carta de arriba sigue en su sitio.
    capa: tecnica
    familia: mezcla-falsa
    compuesto_de:
      - { id: carto.mov.mezcla-por-arriba, etapa: a-tempo }
    requiere: [magia.naturalidad]
    indicadores: [naturalidad]

  - id: carto.tec.forzaje-clasico
    nombre: Forzaje clásico
    descripcion: El espectador «elige libremente» la carta que tú quieres, al pasar las cartas de una mano a otra.
    capa: tecnica
    familia: forzaje
    compuesto_de: [carto.mov.break-menique]
    requiere:
      - { id: magia.timing, modo: aplicado }
      - { id: actuacion.leer-publico, modo: intuitivo }
    indicadores: [timing, naturalidad]

  # --- Efectos ---
  - id: carto.efecto.carta-ambiciosa
    nombre: Fase de carta ambiciosa
    descripcion: La carta elegida, metida en el centro, vuelve arriba.
    capa: efecto
    familia: presentacion
    compuesto_de: [carto.mov.doble-levantada, carto.tec.doble-corte]
    requiere: [magia.desvio-atencion]
    realiza: [magia.efecto.transposicion]
    revisar: true

  - id: carto.efecto.prediccion-forzada
    nombre: Predicción con forzaje
    descripcion: La carta que elige el espectador estaba escrita de antemano.
    capa: efecto
    familia: presentacion
    compuesto_de: [carto.tec.forzaje-clasico, carto.tec.mezcla-falsa]
    realiza: [magia.efecto.prediccion]

  # --- Rutina y espectáculo ---
  - id: carto.rutina.carta-ambiciosa
    nombre: Rutina de carta ambiciosa
    descripcion: Varias fases encadenadas con progresión y un final fuerte.
    capa: rutina
    familia: presentacion
    compuesto_de:
      - { id: carto.efecto.carta-ambiciosa, etapa: combinada }
    requiere: [magia.guion, magia.timing]
    indicadores: [presentacion, timing]

  - id: carto.espectaculo.set-de-cerca
    nombre: Set de magia de cerca
    descripcion: Diez minutos para un grupo pequeño; abrir, encadenar dos rutinas y cerrar.
    capa: espectaculo
    familia: presentacion
    compuesto_de: [carto.rutina.carta-ambiciosa, carto.efecto.prediccion-forzada]
    requiere:
      - actuacion.presencia
      - actuacion.adaptar-al-estado
      - { id: magia.angulos, modo: aplicado }
    caracteriza: [magia.estilo.cerca]
    indicadores: [presentacion, angulos]
