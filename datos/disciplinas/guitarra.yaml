# Disciplina Guitarra (dominio Música).
# Vía de prueba: salsa, que es lo que estás aprendiendo ahora.
# Unas pocas piezas de bulería comprueban que la misma célula sirve a dos estilos.

disciplina:
  id: guitarra
  nombre: Guitarra
  dominio: musica
  capas:
    ritmo: [golpe, celula]            # mano derecha
    armonia: [nota, acorde, enlace]   # mano izquierda
    union: [patron, ciclo, seccion, tema]   # donde convergen las dos cadenas
  familias:
    - { id: rasgueo, nombre: Rasgueo }
    - { id: apagado, nombre: Apagados y golpes percusivos }
    - { id: punteo, nombre: Punteo y bajos }
    - { id: posicion, nombre: Acordes y posiciones }
    - { id: acompanamiento, nombre: Acompañamiento }
    - { id: improvisacion, nombre: Improvisación }
  etiquetas_capas: { celula: célula, patron: patrón, seccion: sección }
  indicadores:
    - { id: tempo, nombre: Tempo, descripcion: "Velocidad a la que sale limpio, medida con metrónomo." }
    - { id: limpieza, nombre: Limpieza, descripcion: "Que suene lo que tiene que sonar y calle lo que tiene que callar." }
    - { id: cuadratura, nombre: Cuadratura, descripcion: "Encaje con el patrón rector del estilo (la clave, el compás de 12)." }
    - { id: dinamica, nombre: Dinámica, descripcion: "Capacidad de subir y bajar intensidad sin perder el patrón." }
    - { id: soltura, nombre: Soltura, descripcion: "Tocarlo sin mirar, hablando o cantando encima." }

piezas:
  # --- Cadena rítmica: golpe → célula ---
  - id: guitarra.golpe.abajo
    nombre: Rasgueo hacia abajo
    capa: golpe
    familia: rasgueo

  - id: guitarra.golpe.arriba
    nombre: Rasgueo hacia arriba
    capa: golpe
    familia: rasgueo

  - id: guitarra.golpe.apagado
    nombre: Golpe apagado
    descripcion: Rasguear soltando la presión de la mano izquierda para que suene seco, sin nota.
    capa: golpe
    familia: apagado

  - id: guitarra.golpe.punteo
    nombre: Punteo de una o dos cuerdas
    descripcion: Pulsar notas sueltas con dedos o púa en vez de rasguear.
    capa: golpe
    familia: punteo

  - id: guitarra.celula.corcheas-alternas
    nombre: Vaivén de corcheas
    descripcion: Abajo-arriba continuo en corcheas; la mano no para aunque no toque.
    capa: celula
    familia: rasgueo
    compuesto_de: [guitarra.golpe.abajo, guitarra.golpe.arriba]
    realiza: [musica.subdivision]
    indicadores: [tempo, limpieza]

  - id: guitarra.celula.acentos-y-apagados
    nombre: Acentos y apagados dentro del vaivén
    descripcion: Sin parar el vaivén, elegir qué golpes suenan, cuáles se apagan y cuáles se acentúan.
    capa: celula
    familia: apagado
    compuesto_de:
      - { id: guitarra.celula.corcheas-alternas, etapa: a-tempo }
      - guitarra.golpe.apagado
    realiza: [musica.acento, musica.contratiempo]
    indicadores: [limpieza, cuadratura]

  # --- Cadena armónica: nota → acorde → enlace ---
  - id: guitarra.nota.bajos
    nombre: Fundamentales en las cuerdas graves
    descripcion: Encontrar sin pensar la nota raíz de cada acorde en la sexta y la quinta cuerda.
    capa: nota
    familia: punteo
    realiza: [musica.altura]

  - id: guitarra.acorde.mayores-menores
    nombre: Acordes mayores y menores
    descripcion: Posiciones abiertas y con cejilla.
    capa: acorde
    familia: posicion
    realiza: [musica.acorde]

  - id: guitarra.acorde.septima
    nombre: Acordes de séptima de dominante
    capa: acorde
    familia: posicion
    requiere: [guitarra.acorde.mayores-menores]
    realiza: [musica.acorde]

  - id: guitarra.acorde.voces-agudas
    nombre: Voces en cuerdas agudas
    descripcion: Acordes de tres o cuatro cuerdas agudas, para dejar sitio al bajo y sonar más ligero.
    capa: acorde
    familia: posicion
    requiere: [guitarra.acorde.mayores-menores]
    realiza: [musica.acorde]
    revisar: true

  - id: guitarra.enlace.I-IV-V
    nombre: Enlaces I-IV-V
    descripcion: Pasar entre tónica, subdominante y dominante sin cortar el ritmo.
    capa: enlace
    familia: posicion
    compuesto_de: [guitarra.acorde.voces-agudas, guitarra.acorde.septima]
    requiere:
      - { id: musica.funcion-armonica, modo: intuitivo }
    realiza: [musica.funcion-armonica]
    indicadores: [tempo, soltura]

  # --- Unión: patrón → ciclo → sección → tema ---
  - id: guitarra.patron.rasgueo-salsa
    nombre: Rasgueo de salsa
    descripcion: Acentos y apagados colocados para encajar con la clave.
    capa: patron
    familia: acompanamiento
    compuesto_de: [guitarra.celula.acentos-y-apagados]
    requiere:
      - { id: musica.salsa.clave-son, modo: intuitivo }
    realiza: [musica.patron-ritmico]
    caracteriza: [musica.estilo.salsa]
    indicadores: [cuadratura, tempo]

  - id: guitarra.patron.tumbao-bajo
    nombre: Tumbao de bajo en la guitarra
    descripcion: Bajo anticipado en las cuerdas graves, en el «y» del 2 y en el 4.
    capa: patron
    familia: punteo
    compuesto_de: [guitarra.golpe.punteo, guitarra.nota.bajos]
    requiere: [musica.contratiempo]
    realiza: [musica.salsa.bajo-anticipado]
    caracteriza: [musica.estilo.salsa]
    indicadores: [cuadratura]

  - id: guitarra.patron.montuno
    nombre: Montuno adaptado a la guitarra
    descripcion: Notas del acorde en contratiempo, a la manera del tres o del piano.
    capa: patron
    familia: punteo
    compuesto_de: [guitarra.golpe.punteo, guitarra.acorde.voces-agudas]
    requiere:
      - { id: musica.salsa.clave-son, modo: intuitivo }
    realiza: [musica.salsa.montuno]
    caracteriza: [musica.estilo.salsa]
    indicadores: [cuadratura, limpieza]
    revisar: true

  - id: guitarra.ciclo.montuno-progresion
    nombre: Montuno sobre I-IV-V-IV
    descripcion: El montuno o el rasgueo recorriendo la progresión entera, vuelta tras vuelta, sin perder la clave.
    capa: ciclo
    familia: acompanamiento
    compuesto_de:
      - { id: guitarra.patron.montuno, etapa: a-tempo }
      - guitarra.enlace.I-IV-V
    realiza: [musica.progresion]
    caracteriza: [musica.estilo.salsa]
    indicadores: [tempo, cuadratura, soltura]

  - id: guitarra.ciclo.bajo-y-acorde
    nombre: Bajo y acorde a la vez
    descripcion: Tumbao de bajo con el pulgar y acordes agudos con los dedos; una sola guitarra hace dos papeles.
    capa: ciclo
    familia: acompanamiento
    compuesto_de:
      - { id: guitarra.patron.tumbao-bajo, etapa: a-tempo }
      - guitarra.acorde.voces-agudas
    requiere:
      - { id: musica.polirritmia, modo: intuitivo }
    realiza: [musica.textura]
    caracteriza: [musica.estilo.salsa]

  - id: guitarra.seccion.acompanar-montuno
    nombre: Sostener el montuno con dinámica
    descripcion: Acompañar la sección de coro y pregón subiendo y bajando la intensidad según la canción.
    capa: seccion
    familia: acompanamiento
    compuesto_de:
      - { id: guitarra.ciclo.montuno-progresion, etapa: combinada }
    requiere:
      - musica.dinamica
      - { id: musica.forma, modo: intuitivo }
    caracteriza: [musica.estilo.salsa]
    indicadores: [dinamica, soltura]

  - id: guitarra.seccion.improvisar-montuno
    nombre: Variar el montuno en tiempo real
    descripcion: Adornos, huecos y respuestas al pregón sin salirse de la clave.
    capa: seccion
    familia: improvisacion
    requiere:
      - { id: guitarra.ciclo.montuno-progresion, etapa: expresiva }
      - { id: musica.salsa.clave-son, modo: aplicado }
      - { id: musica.funcion-armonica, modo: intuitivo }
      - actuacion.improvisacion
    caracteriza: [musica.estilo.salsa]
    indicadores: [cuadratura, dinamica]

  - id: guitarra.tema.salsa-completa
    nombre: Un tema de salsa entero
    descripcion: Tema, montuno, mambo y final, de principio a fin y delante de alguien.
    capa: tema
    familia: acompanamiento
    compuesto_de: [guitarra.seccion.acompanar-montuno]
    requiere:
      - { id: musica.forma, modo: nombrado }
      - actuacion.repertorio-fijo
    caracteriza: [musica.estilo.salsa]

  # --- Bulería: reutiliza la misma célula ---
  - id: guitarra.patron.compas-buleria
    nombre: Rasgueo a compás de bulería
    descripcion: Marcar el ciclo de doce con los acentos en su sitio.
    capa: patron
    familia: rasgueo
    compuesto_de: [guitarra.celula.acentos-y-apagados]
    realiza: [musica.buleria.compas-12]
    caracteriza: [musica.estilo.buleria]
    revisar: true

  - id: guitarra.patron.remate-buleria
    nombre: Remate de bulería
    capa: patron
    familia: rasgueo
    compuesto_de: [guitarra.patron.compas-buleria]
    realiza: [musica.buleria.remate]
    caracteriza: [musica.estilo.buleria]
    revisar: true
